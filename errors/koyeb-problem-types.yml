format_note: Koyeb does NOT use RFC 9457 application/problem+json. Every error is application/json carrying the grpc-gateway
  envelope {status, code, message}; 400 responses extend it with fields[] ({field, description}). The catch-all "default"
  response is a google.rpc.Status {code, message, details[]}.
envelope:
  content_type: application/json
  schemas:
    Error:
      status: integer (int32) — mirrors the HTTP status
      code: string — machine-readable slug, e.g. authentication_error
      message: string — human-readable text
    ErrorWithFields:
      status: integer (int32)
      code: string
      message: string
      fields: array of ErrorField {field, description} — per-field validation detail
    google.rpc.Status:
      code: integer (int32) — google.rpc.Code, not HTTP
      message: string
      details: array of protobuf Any
