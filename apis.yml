aid: koyeb
name: Koyeb
description: >-
  Koyeb is a developer-friendly serverless platform for deploying applications, Postgres databases, GPU workloads and isolated
  code-execution sandboxes across a global edge network. The Koyeb REST API is a Swagger 2.0 contract generated from protobuf
  services by grpc-gateway — 126 paths, 177 operations and 422 schemas, all under /v1 on https://app.koyeb.com — covering
  apps, services, deployments, regional deployments, instances, secrets, volumes, snapshots, domains, organizations, quotas,
  budgets and usage. Authentication is a single organization-wide bearer token with no scopes; the platform is also driven
  by a first-party Go CLI, JavaScript/Python/Go SDKs, Terraform and Pulumi providers, an MCP server, and sixteen published
  Agent Skills. Koyeb entered into a definitive agreement with Mistral AI in February 2026.
