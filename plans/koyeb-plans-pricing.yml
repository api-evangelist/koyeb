specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Koyeb
providerId: koyeb
created: '2026-05-04'
generated: '2026-08-17'
modified: '2026-08-17'
method: searched
source: https://www.koyeb.com/pricing
secondary_sources:
  - https://www.koyeb.com/docs/faqs/pricing
  - https://www.koyeb.com/docs/legal/sla
provenance_note: >-
  REPLACES the 2026-05-04 bulk-sweep scaffold, which invented three tiers (koyeb-free / koyeb-pro /
  koyeb-enterprise) with a 1,000-requests-per-month API quota. Koyeb does not meter API requests as a
  billable unit at all — it bills compute, storage and bandwidth, and the API is included. The tiers below
  are the ones actually published on the pricing page.
tags:
  - Cloud Platform
  - Deployment
  - PaaS
  - Serverless
  - Pricing
description: >-
  Koyeb's published subscription tiers and usage rates as of 2026-08-17. Koyeb is a usage-billed platform
  with a subscription floor: the monthly subscription price includes a compute credit, and everything beyond
  it is metered per hour (instances, GPUs, Postgres) or per GB (storage, bandwidth). API access is not a
  billable line item and is not rate-carded — every plan reaches the same REST API.
billing_model: subscription-plus-usage
currency: USD
plan_count: 4
api_metered: false
api_metered_note: >-
  There is no per-request API price, no request quota, and no API-call line item on the pricing page. See
  rate-limits/koyeb-rate-limits.yml for the technical (non-billable) 400 req/60s ceiling.
plans:
  - id: koyeb-hobby
    name: Hobby
    type: freemium
    price: '0.00'
    currency: USD
    billing_period: month
    description: >-
      Free entry tier. Recorded as present because the pricing page carries free allowances (a free Postgres
      tier at $0/hr for 5 hours, 10 free custom domains) and the platform offers self-serve signup with no
      card; the published feature table details the paid tiers rather than itemising this one.
    confidence: medium
    entries:
      - label: Serverless Postgres free allowance
        name: postgres_free_hours
        type: quota
        metric: hours
        limit: 5
        timeFrame: month
        price: '0.00'
        source_quote: 'Free 5h tier: $0/hr'
    elements:
      - name: Koyeb API (full REST surface)
      - name: Koyeb CLI
      - name: Self-serve signup
      - name: Community support (slack.koyeb.com, community.koyeb.com)
  - id: koyeb-pro
