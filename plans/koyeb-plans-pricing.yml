        type: quota
        metric: seats
        limit: 10
        timeFrame: null
      - label: Services
        name: services
        type: quota
        metric: services
        limit: 100
        timeFrame: null
      - label: Concurrent builds
        name: concurrent_builds
        type: rate
        metric: builds
        limit: 5
        timeFrame: null
    elements:
      - name: NVMe Volumes and Snapshots
      - name: E-mail support and chat
      - name: Koyeb API (full REST surface)
  - id: koyeb-scale
    name: Scale
    type: paid
    price: '299.00'
    currency: USD
    billing_period: month
    description: Scale tier — adds AWS regions, cross-connect and a contractual uptime SLA.
    entries:
      - label: Included compute
        name: included_compute
        type: credit
        metric: usd
        limit: 100
        timeFrame: month
        price: '0.00'
        source_quote: $100 included compute
      - label: Users
        name: users
        type: quota
        metric: seats
        limit: 50
        timeFrame: null
      - label: Services
        name: services
        type: quota
        metric: services
        limit: 1000
        timeFrame: null
    sla:
      uptime_target: 99.9%
      source_quote: 99.9% uptime SLA
      terms: https://www.koyeb.com/docs/legal/sla
    elements:
      - name: AWS Regions access
      - name: Slack cross-connect
      - name: Koyeb API (full REST surface)
  - id: koyeb-enterprise
    name: Enterprise
    type: custom
    price: null
    price_floor: '1000.00'
    currency: USD
    billing_period: month
    description: Custom contract; the pricing page states it starts at $1000/mo.
    entries:
      - label: Users
        name: users
        type: quota
        metric: seats
        limit: null
        unlimited: true
    sla:
      uptime_target: 99.99%
      source_quote: 99.99% uptime SLA
      terms: https://www.koyeb.com/docs/legal/sla
    compliance:
      certifications_named:
        - ISO 27001
        - SOC 2
      source_quote: ISO27001 and SOC2 Certifications
    elements:
