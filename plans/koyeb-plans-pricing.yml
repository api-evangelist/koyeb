programmatic_billing_surface:
  note: >-
    Koyeb exposes billing to the API, which is unusual and worth recording: the published Swagger document
    carries GetSubscription, NextInvoice, HasUnpaidInvoices, Manage, GetOrganizationUsage,
    GetOrganizationUsageDetails, ListUsage, GetQuotas, CreateBudget/GetBudget/UpdateBudget/DeleteBudget,
    CheckCoupon/RedeemCoupon and the PaymentMethods collection. A consumer can read its own spend and set a
    budget programmatically.
  finops: finops/koyeb-finops.yml
