description: >-
  First-party Koyeb client libraries, agent tooling, infrastructure-as-code providers and the CLI, with the
  latest published version and its release date read from each registry's metadata endpoint on 2026-08-17.
  Koyeb has no single flagship SDK: the JavaScript client (@koyeb/api-client-js) is the one the MCP server
  itself consumes, the Python client ships as koyeb-sdk, and the Go client is a generated module with no
  tagged releases. Every entry below was resolved to a koyeb-owned repository before being marked official.
