certification_source: >-
  Named on Koyeb's own pricing page as an Enterprise-tier entitlement — verbatim "ISO27001 and SOC2
  Certifications" (https://www.koyeb.com/pricing). NOT read off the Trust Center itself; see the caveat.
caveat: >-
  trust.koyeb.com is a client-rendered Vanta single-page app. The server response contains only the shell
  plus the page title and canonical URL — no certification list, no subprocessor list, no document list, no
  security-contact address is present in the HTML. Vanta retired its public GraphQL API (api.eu.vanta.com
  returns HTTP 410 "The GraphQL API is no longer available in favor of the Vanta REST API"), and
  /api/trust-report, /sitemap.xml and /robots.txt all return the same SPA shell. So the trust center is
  REAL and VERIFIED to exist, its contents are NOT machine-readable, and the two certifications above are
  corroborated from the pricing page rather than inspected in the Trust Center.
