  databases:
    - koyeb databases create
    - koyeb databases delete
    - koyeb databases get
    - koyeb databases list
    - koyeb databases update
  subcommand_source: >-
    Read from the koyeb-commands.md reference files in github.com/koyeb/koyeb-skills, which the repo's own
    scripts/generate-koyeb-flag-refs.py regenerates from live `koyeb --help` output — so these are the real
    command names, not a docs paraphrase.
key_flows:
  - name: Zero-config directory deploy
    commands: [koyeb deploy]
    note: Tars the working directory, uploads it as an archive, and creates or updates the service. Same flow the MCP "deploy" tool automates.
  - name: Compose-file provisioning
    commands: [koyeb compose]
    note: Creates resources from a koyeb-compose.yaml file; backed by the Compose operation in the REST API.
  - name: Exec into a running instance
    commands: [koyeb services exec, koyeb sandbox run]
    note: Backed by the WebSocket stream wss://app.koyeb.com/v1/streams/instances/exec.
  - name: Log tail and query
    commands: [koyeb services logs, koyeb sandbox logs]
    note: Backed by QueryLogs and TailLogs.
  - name: Scripting with structured output
    commands: [koyeb services list --output json]
    note: >-
      Koyeb's own Agent Skills instruct agents to prefer --output json and to avoid assuming column order in
      table output.
autocompletion:
  bash_linux: koyeb completion bash > /etc/bash_completion.d/koyeb
  bash_macos: koyeb completion bash > /usr/local/etc/bash_completion.d/koyeb
  zsh: koyeb completion zsh > "${fpath[1]}/_koyeb"
agent_skills: skills/_index.yml
