provider: Koyeb
providerId: koyeb
name: koyeb
description: >-
  The Koyeb CLI is a first-party Go binary and, in practice, the primary programmatic surface for the
  platform: it is more complete than the MCP server (13 of 177 operations) and it is what all sixteen of
  Koyeb's published Agent Skills drive. It reads the same bearer token as the REST API and defaults its
  --url to https://app.koyeb.com, so it is a thin, honest client over the published contract.
version: v5.10.2
version_published: '2026-05-12'
repository: https://github.com/koyeb/koyeb-cli
license: Apache-2.0
language: go
docs:
  reference: https://www.koyeb.com/docs/build-and-deploy/cli/reference
  installation: https://www.koyeb.com/docs/build-and-deploy/cli/installation
package: packages/koyeb-packages.yml
install:
  - method: homebrew
    command: brew install koyeb/tap/koyeb
    tap: https://github.com/koyeb/homebrew-tap
    formula_version: 5.10.2
  - method: shell-script
    command: curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
    post_install: export PATH=$HOME/.koyeb/bin:$PATH
    note: Add the PATH line to .bashrc or .zshrc.
  - method: docker
    command: docker pull koyeb/koyeb-cli:latest
  - method: binary
    command: Download from https://github.com/koyeb/koyeb-cli/releases
    platforms: [darwin/amd64, darwin/arm64, linux/amd64, linux/arm64, windows/amd64, windows/arm64]
    checksums: checksums.txt is published with every release
authentication:
  interactive: koyeb login
  non_interactive_env_var: KOYEB_API_TOKEN
  flag: --token
  token_creation_url: https://app.koyeb.com/user/settings/api
  config_file: $HOME/.koyeb.yaml
  organization_context:
    - koyeb organization list
    - koyeb organization switch <org-id-or-name>
global_flags:
  - {flag: '-c, --config string', description: 'Config file (default: $HOME/.koyeb.yaml)'}
  - {flag: '-d, --debug', description: Enable debug output}
  - {flag: '--debug-full', description: Do not hide sensitive information in debug output}
  - {flag: '--force-ascii', description: Only output ASCII characters}
  - {flag: '--full', description: Do not truncate output}
  - {flag: '-h, --help', description: Help for command}
  - {flag: '-o, --output output', description: 'Output format: yaml, json, or table'}
  - {flag: '--organization string', description: Organization ID}
  - {flag: '--token string', description: API token}
  - {flag: '--url string', description: 'API URL (default: https://app.koyeb.com)'}
command_pattern:
  list: koyeb <resource> list
  get: koyeb <resource> get <id-or-name>
  describe: koyeb <resource> describe <id-or-name>
  create: koyeb <resource> create ...
  update: koyeb <resource> update <id-or-name> ...
  delete: koyeb <resource> delete <id-or-name>
  source: >-
    Documented verbatim in the shared reference Koyeb ships with its Agent Skills
    (plugins/koyeb/skills/_shared/references/koyeb-cli.md).
command_groups:
  - {name: apps, purpose: Manage applications and their lifecycle}
  - {name: archives, purpose: Handle archived project uploads}
  - {name: compose, purpose: Create resources from a koyeb-compose.yaml file}
  - {name: databases, purpose: Manage database instances}
  - {name: deploy, purpose: Deploy a directory to Koyeb}
  - {name: deployments, purpose: Monitor and control deployment operations}
  - {name: domains, purpose: Manage custom and default domains}
  - {name: instances, purpose: Manage individual service instances}
  - {name: login, purpose: Authenticate with your Koyeb account}
  - {name: metrics, purpose: Access service performance metrics}
  - {name: organizations, purpose: Switch between and list organizations}
  - {name: regional-deployments, purpose: Manage regional deployment configurations}
  - {name: sandbox, purpose: Interactive execution environments (the Koyeb Sandboxes product)}
  - {name: secrets, purpose: Store and manage sensitive configuration data}
  - {name: services, purpose: Create and manage deployed services}
  - {name: snapshots, purpose: Persist and restore service state}
  - {name: version, purpose: Display the CLI version information}
  - {name: volumes, purpose: Manage persistent storage volumes}
  - {name: whoami, purpose: Display current user or organization details}
verified_subcommands:
