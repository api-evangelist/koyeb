definitions:
  GetOAuthOptionsReply:
    type: object
    properties:
      oauth_providers:
        type: array
        items:
          $ref: '#/definitions/OAuthProvider'
    description: A list of providers which you can use for single sign-on.
  PublicOrganization:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      plan:
        $ref: '#/definitions/Plan'
      status:
        $ref: '#/definitions/Organization.Status'
      external_id:
        type: string
  OAuthCallbackRequest:
    type: object
    properties:
      state:
        type: string
        title: The state created at the origin of the OAuth flow
      code:
        type: string
        title: The code returned by the OAuth provider
      setup_action:
        type: string
        description: 'setup_action is populated in the context of a GitHub app installation

          request. For logins and signups, it is not set.'
      installation_id:
        type: string
        description: 'installation_id is populated in the context of a GitHub app installation

          request. For logins and signups, it is not set.'
  UserFlags:
    type: string
    enum:
    - ADMIN
    - TEST
    - RESTRICTED
    - ACTIVE
    - BETA
    - MAX_ORGANIZATIONS_25
    - MAX_ORGANIZATIONS_100
    - MAX_ORGANIZATIONS_1000
    - MAX_ORGANIZATIONS_10000
    - MAX_ORGANIZATIONS_100000
    - MAX_ORGANIZATIONS_1000000
    - PARTNER_CSP
    - IGNORE_ORGANIZATION_NAME_RESERVATION_RULE_NEON_PREFIX
    default: ADMIN
    title: "- ADMIN: A user is an admin user\n - TEST: A user is a test user\n - RESTRICTED: Whether this account as restricted access\n - ACTIVE: Whether this account is active\n - BETA: Account in beta program\n - MAX_ORGANIZATIONS_25: User can create this much organizations, overriding the default amount\n - PARTNER_CSP: User can create sub-organizations\n - IGNORE_ORGANIZATION_NAME_RESERVATION_RULE_NEON_PREFIX: User can bypass organization name reservations rules"
  OAuthProvider:
    type: object
    properties:
      id:
        type: string
        title: The name of the provider (.e.g github, google)
      url:
        type: string
        title: The URL to call to initiate the OAuth flow
      state:
        type: string
        title: 'The OAuth state required by the protocol, it is only valid 10 minutes and

          encodes information about the type of flow'
  LoginMethodReply.Method:
    type: string
    enum:
    - KOYEB
    - WORKOS
    default: KOYEB
  ListUserOrganizationsReply:
    type: object
    properties:
      organizations:
        type: array
        items:
          $ref: '#/definitions/Organization'
        title: The collection of organizations
      limit:
        type: integer
        format: int64
        title: The limit in the request
      offset:
        type: integer
        format: int64
        title: The offset in the request
      has_next:
        type: boolean
        title: If there is more items after in the collection
  UserSettings:
    type: object
    properties:
      id:
        type: string
      user_id:
        type: string
      failed_deployment_email_notification:
        type: boolean
  ResetPasswordRequest:
    type: object
    example:
      email: john@snow.com
    properties:
      email:
        type: string
  UpdateUserRequest.UserUpdateBody:
    type: object
    properties:
      id:
        type: string
      email:
        type: string
      current_password:
        type: string
      password:
        type: string
      newsletter_subscribed:
        type: boolean
      name:
        type: string
  UpdateUserSettingsRequest:
    type: object
    properties:
      failed_deployment_email_notification:
        type: boolean
        description: (Optional) Toggle failed deployment email notification.
  PublicUser:
    type: object
    properties:
      id:
        type: string
      email:
        type: string
      name:
        type: string
      avatar_url:
        type: string
      github_id:
        type: string
      github_user:
        type: string
  Token:
    type: object
    example:
      id: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      expires: '2022-09-08T14:00:00Z'
      user_id: 996d7822-6b58-11e9-956f-32001b70f000
      organization_id: 9f33b2c6-6b58-11e9-883c-32001b70f000
    properties:
      id:
        type: string
      user_id:
        type: string
      organization_id:
        type: string
      expires_at:
        type: string
        format: date-time
  UserReply:
    type: object
    properties:
      user:
        $ref: '#/definitions/User'
  OAuthCallbackReply:
    type: object
    properties:
      token:
        $ref: '#/definitions/Token'
        title: A jwt token to be used for session
  UserRole.Role:
    type: string
    enum:
    - INVALID
    - OWNER
    default: INVALID
  ErrorWithFields:
    type: object
    properties:
      status:
        type: integer
        format: int32
      code:
        type: string
      message:
        type: string
      fields:
        type: array
        items:
          $ref: '#/definitions/ErrorField'
  AcceptOrganizationInvitationReply:
    type: object
    properties:
      invitation:
        $ref: '#/definitions/OrganizationInvitation'
        title: The organization invitation accepted
  ClearIdenfyVerificationResultReply:
    type: object
  ErrorField:
    type: object
    properties:
      field:
        type: string
      description:
        type: string
  Plan:
    type: string
    enum:
    - hobby
    - starter
    - startup
    - business
    - enterprise
    - internal
    - hobby23
    - no_plan
    - pro
    - scale
    - partner_csp
    - partner_csp_unit
    default: hobby
  Error:
    type: object
    properties:
      status:
        type: integer
        format: int32
      code:
        type: string
      message:
        type: string
  OrganizationDetailedStatus:
    type: string
    enum:
    - NEW
    - EMAIL_NOT_VALIDATED
    - BILLING_INFO_MISSING
    - LOCKED
    - PAYMENT_FAILURE
    - VALID
    - PENDING_VERIFICATION
    - VERIFICATION_FAILED
    - REVIEWING_ACCOUNT
    - PLAN_UPGRADE_REQUIRED
    default: NEW
  GetUserSettingsReply:
    type: object
    properties:
      settings:
        $ref: '#/definitions/UserSettings'
  CreateAccountRequest:
    type: object
    example:
      email: john@snow.com
      password: '...'
    properties:
      email:
        type: string
      password:
        type: string
      name:
        type: string
      captcha:
        type: string
    description: Create new account
    title: Create new account
    required:
    - email
    - password
  DeclineOrganizationInvitationReply:
    type: object
    properties:
      invitation:
        $ref: '#/definitions/OrganizationInvitation'
        title: The organization invitation declined
  UpdatePasswordRequest:
    type: object
    example:
      id: '...'
      password: '...'
    properties:
      id:
        type: string
      password:
        type: string
  google.rpc.Status:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/google.protobuf.Any'
  LoginMethodReply:
    type: object
    properties:
      method:
        $ref: '#/definitions/LoginMethodReply.Method'
  Organization:
    type: object
    properties:
      id:
        type: string
      external_id:
        type: string
      provisioning:
        type: boolean
      address1:
        type: string
      address2:
        type: string
      city:
        type: string
      postal_code:
        type: string
      state:
        type: string
      country:
        type: string
      company:
        type: boolean
      vat_number:
        type: string
      billing_name:
        type: string
      billing_email:
        type: string
      name:
        type: string
      plan:
        $ref: '#/definitions/Plan'
      plan_updated_at:
        type: string
        format: date-time
      has_payment_method:
        type: boolean
      subscription_id:
        type: string
      current_subscription_id:
        type: string
      latest_subscription_id:
        type: string
      signup_qualification:
        type: object
      status:
        $ref: '#/definitions/Organization.Status'
      status_message:
        $ref: '#/definitions/OrganizationDetailedStatus'
      deactivation_reason:
        $ref: '#/definitions/Organization.DeactivationReason'
      verified:
        type: boolean
      qualifies_for_hobby23:
        type: boolean
      reprocess_after:
        type: string
        format: date-time
      trialing:
        type: boolean
      trial_starts_at:
        type: string
        format: date-time
      trial_ends_at:
        type: string
        format: date-time
      email_domain_allowlist:
        type: array
        items:
          type: string
    title: Represent an Organization
  ResendEmailValidationRequest:
    type: object
  UpdateUserSettingsReply:
    type: object
    properties:
      settings:
        $ref: '#/definitions/UserSettings'
  OrganizationInvitation:
    type: object
    properties:
      id:
        type: string
      email:
        type: string
      role:
        $ref: '#/definitions/UserRole.Role'
      status:
        $ref: '#/definitions/OrganizationInvitation.Status'
      expires_at:
        type: string
        format: date-time
      organization_id:
        type: string
      organization:
        $ref: '#/definitions/PublicOrganization'
      invitee_id:
        type: string
      invitee:
        $ref: '#/definitions/PublicUser'
      inviter_id:
        type: string
      inviter:
        $ref: '#/definitions/PublicUser'
  Organization.Status:
    type: string
    enum:
    - WARNING
    - LOCKED
    - ACTIVE
    - DEACTIVATING
    - DEACTIVATED
    - DELETING
    - DELETED
    default: WARNING
  User:
    type: object
    example:
      id: 78352123-a06f-4ec2-81ed-27a056725385
      email: john@snow.com
      name: John Snow
      avatar_url: https://www.gravatar.com/avatar/00000000000000000000000000000000
      is_admin: false
      is_test: true
      two_factor_authentication: false
      last_login: '0001-01-01T00:00:00Z'
      last_login_id: 10.1.1.1
      updated_at: '0001-01-01T00:00:00Z'
      created_at: '0001-01-01T00:00:00Z'
      newsletter_subscribed: true
      email_validated: true
    properties:
      id:
        type: string
      email:
        type: string
      avatar_url:
        type: string
      two_factor_authentication:
        type: boolean
      last_login:
        type: string
        format: date-time
      last_login_ip:
        type: string
      updated_at:
        type: string
        format: date-time
      created_at:
        type: string
        format: date-time
      newsletter_subscribed:
        type: boolean
      github_id:
        type: string
      github_user:
        type: string
      flags:
        type: array
        items:
          $ref: '#/definitions/UserFlags'
      name:
        type: string
      email_validated:
        type: boolean
      trialed:
        type: boolean
    title: Represent a User
  OrganizationInvitation.Status:
    type: string
    enum:
    - INVALID
    - PENDING
    - ACCEPTED
    - REFUSED
    - EXPIRED
    default: INVALID
  ClearIdenfyVerificationResultRequest:
    type: object
    properties:
      user_id:
        type: string
      organization_id:
        type: string
  GetIdenfyTokenReply:
    type: object
    properties:
      auth_token:
        type: string
  LoginReply:
    type: object
    properties:
      token:
        $ref: '#/definitions/Token'
  GetOrganizationReply:
    type: object
    properties:
      organization:
        $ref: '#/definitions/Organization'
  GetUserOrganizationInvitationReply:
    type: object
    properties:
      invitation:
        $ref: '#/definitions/OrganizationInvitation'
  ResendEmailValidationReply:
    type: object
  Organization.DeactivationReason:
    type: string
    enum:
    - INVALID
    - REQUESTED_BY_OWNER
    - SUBSCRIPTION_TERMINATION
    - LOCKED_BY_ADMIN
    - VERIFICATION_FAILED
    - TRIAL_DID_NOT_CONVERT
    default: INVALID
  ResetPasswordReply:
    type: object
  ListUserOrganizationInvitationsReply:
    type: object
    properties:
      invitations:
        type: array
        items:
          $ref: '#/definitions/OrganizationInvitation'
        title: The collection of organization invitations
      limit:
        type: integer
        format: int64
        title: The limit in the request
      offset:
        type: integer
        format: int64
        title: The offset in the request
      count:
        type: integer
        format: int64
        title: The total number of items
  google.protobuf.Any:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
