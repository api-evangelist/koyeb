openapi: 3.2.0
info:
  title: Koyeb Rest Logs API
  description: 'The Koyeb API allows you to interact with the Koyeb platform in a simple, programmatic way using conventional HTTP requests.

    '
  version: 1.0.0
servers:
- url: https://app.koyeb.com
security:
- Bearer: []
tags:
- name: Logs
paths:
  /v1/streams/logs/query:
    get:
      summary: Query logs
      operationId: QueryLogs
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryLogsReply'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithFields'
        '401':
          description: Returned when the token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Returned when the user does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Returned when the resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Returned in case of server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: type
        description: Type of logs to retrieve, either "build" or "runtime". Defaults to "runtime".
        in: query
        required: false
        schema:
          type: string
      - name: app_id
        description: (Optional) Filter on the provided app_id. At least one of app_id, service_id, deployment_id, regional_deployment_id or instance_ids must be set.
        in: query
        required: false
        schema:
          type: string
      - name: service_id
        description: (Optional) Filter on the provided service_id. At least one of app_id, service_id, deployment_id, regional_deployment_id or instance_ids must be set.
        in: query
        required: false
        schema:
          type: string
      - name: deployment_id
        description: (Optional) Filter on the provided deployment_id. At least one of app_id, service_id, deployment_id, regional_deployment_id or instance_ids must be set.
        in: query
        required: false
        schema:
          type: string
      - name: regional_deployment_id
        description: (Optional) Filter on the provided regional_deployment_id. At least one of app_id, service_id, deployment_id, regional_deployment_id or instance_ids must be set.
        in: query
        required: false
        schema:
          type: string
      - name: instance_id
        description: Deprecated, prefer using instance_ids instead.
        in: query
        required: false
        schema:
          type: string
      - name: instance_ids
        description: (Optional) Filter on the provided instance_ids. At least one of app_id, service_id, deployment_id, regional_deployment_id or instance_ids must be set.
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: stream
        description: Deprecated, prefer using streams instead.
        in: query
        required: false
        schema:
          type: string
      - name: streams
        description: '(Optional) Filter on stream: either "stdout", "stderr" or "koyeb" (for system logs).'
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: start
        description: (Optional) Must always be before `end`. Defaults to 15 minutes ago.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: end
        description: (Optional) Must always be after `start`. Defaults to now.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: order
        description: (Optional) `asc` or `desc`. Defaults to `desc`.
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: (Optional) Defaults to 100. Maximum of 1000.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: regex
        description: (Optional) Apply a regex to filter logs. Can't be used with `text`.
        in: query
        required: false
        schema:
          type: string
      - name: text
        description: (Optional) Looks for this string in logs. Can't be used with `regex`.
        in: query
        required: false
        schema:
          type: string
      - name: regions
        description: (Optional) Filter on the provided regions (e.g. ["fra", "was"]).
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - Logs
  /v1/streams/logs/tail:
    get:
      summary: Tails logs
      operationId: TailLogs
      responses:
        '200':
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/LogEntry'
                  error:
                    $ref: '#/components/schemas/google.rpc.Status'
                title: Stream result of LogEntry
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithFields'
        '401':
          description: Returned when the token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Returned when the user does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Returned when the resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Returned in case of server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: type
        description: Type of logs to retrieve, either "build" or "runtime". Defaults to "runtime".
        in: query
        required: false
        schema:
          type: string
      - name: app_id
        description: (Optional) Filter on the provided app_id. At least one of app_id, service_id, deployment_id, regional_deployment_id or instance_ids must be set.
        in: query
        required: false
        schema:
          type: string
      - name: service_id
        description: (Optional) Filter on the provided service_id. At least one of app_id, service_id, deployment_id, regional_deployment_id or instance_ids must be set.
        in: query
        required: false
        schema:
          type: string
      - name: deployment_id
        description: (Optional) Filter on the provided deployment_id. At least one of app_id, service_id, deployment_id, regional_deployment_id or instance_ids must be set.
        in: query
        required: false
        schema:
          type: string
      - name: regional_deployment_id
        description: (Optional) Filter on the provided regional_deployment_id. At least one of app_id, service_id, deployment_id, regional_deployment_id or instance_ids must be set.
        in: query
        required: false
        schema:
          type: string
      - name: instance_id
        description: Deprecated, prefer using instance_ids instead.
        in: query
        required: false
        schema:
          type: string
      - name: instance_ids
        description: (Optional) Filter on the provided instance_ids. At least one of app_id, service_id, deployment_id, regional_deployment_id or instance_ids must be set.
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: stream
        description: Deprecated, prefer using streams instead.
        in: query
        required: false
        schema:
          type: string
      - name: streams
        description: '(Optional) Filter on stream: either "stdout", "stderr" or "koyeb" (for system logs).'
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: start
        description: (Optional) Defaults to 24 hours ago.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        description: (Optional) Defaults to 1000. Maximum of 1000.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: regex
        description: (Optional) Apply a regex to filter logs. Can't be used with `text`.
        in: query
        required: false
        schema:
          type: string
      - name: text
        description: (Optional) Looks for this string in logs. Can't be used with `regex`.
        in: query
        required: false
        schema:
          type: string
      - name: regions
        description: (Optional) Filter on the provided regions (e.g. ["fra", "was"]).
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - Logs
components:
  schemas:
    ErrorField:
      type: object
      properties:
        field:
          type: string
        description:
          type: string
    QueryLogsReplyPagination:
      type: object
      properties:
        has_more:
          type: boolean
        next_start:
          type: string
          format: date-time
        next_end:
          type: string
          format: date-time
    google.protobuf.Any:
      type: object
      properties:
        '@type':
          type: string
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"
    Error:
      type: object
      properties:
        status:
          type: integer
          format: int32
        code:
          type: string
        message:
          type: string
    LogEntry:
      type: object
      properties:
        msg:
          type: string
        created_at:
          type: string
          format: date-time
        labels:
          type: object
    ErrorWithFields:
      type: object
      properties:
        status:
          type: integer
          format: int32
        code:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ErrorField'
    QueryLogsReply:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        pagination:
          $ref: '#/components/schemas/QueryLogsReplyPagination'
    google.rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
