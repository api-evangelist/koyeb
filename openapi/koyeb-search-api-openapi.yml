swagger: '2.0'
info:
  title: Koyeb Rest activity Search API
  description: 'The Koyeb API allows you to interact with the Koyeb platform in a simple, programmatic way using conventional HTTP requests.

    '
  version: 1.0.0
host: app.koyeb.com
schemes:
- https
security:
- Bearer: []
tags:
- name: Search
paths:
  /v1/search:
    get:
      summary: Search
      operationId: Search
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/ksearch.SearchReply'
        '400':
          description: Validation error
          schema:
            $ref: '#/definitions/ErrorWithFields'
        '401':
          description: Returned when the token is not valid.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Returned when the user does not have permission to access the resource.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Returned when the resource does not exist.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Returned in case of server error.
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Service is unavailable.
          schema:
            $ref: '#/definitions/Error'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
      - name: query
        description: (Optional) Search query
        in: query
        required: false
        type: string
      tags:
      - Search
definitions:
  ksearch.GlobalDeployment:
    type: object
    properties:
      id:
        type: string
      organization_id:
        type: string
      app_id:
        type: string
      service_id:
        type: string
  ksearch.RegionalDeployment:
    type: object
    properties:
      id:
        type: string
      organization_id:
        type: string
      app_id:
        type: string
      service_id:
        type: string
      region:
        type: string
  google.rpc.Status:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/google.protobuf.Any'
  ksearch.Organization:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
  ErrorWithFields:
    type: object
    properties:
      status:
        type: integer
        format: int32
      code:
        type: string
      message:
        type: string
      fields:
        type: array
        items:
          $ref: '#/definitions/ErrorField'
  ksearch.SearchReply:
    type: object
    properties:
      organizations:
        type: array
        items:
          $ref: '#/definitions/ksearch.Organization'
      users:
        type: array
        items:
          $ref: '#/definitions/ksearch.User'
      apps:
        type: array
        items:
          $ref: '#/definitions/ksearch.App'
      services:
        type: array
        items:
          $ref: '#/definitions/ksearch.Service'
      global_deployments:
        type: array
        items:
          $ref: '#/definitions/ksearch.GlobalDeployment'
      regional_deployments:
        type: array
        items:
          $ref: '#/definitions/ksearch.RegionalDeployment'
      instances:
        type: array
        items:
          $ref: '#/definitions/ksearch.Instance'
  ksearch.App:
    type: object
    properties:
      id:
        type: string
      organization_id:
        type: string
      name:
        type: string
  ksearch.User:
    type: object
    properties:
      id:
        type: string
      email:
        type: string
      name:
        type: string
      github_user:
        type: string
  ksearch.Instance:
    type: object
    properties:
      id:
        type: string
      organization_id:
        type: string
      app_id:
        type: string
      service_id:
        type: string
      allocation_id:
        type: string
  google.protobuf.Any:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  ksearch.Service:
    type: object
    properties:
      id:
        type: string
      organization_id:
        type: string
      app_id:
        type: string
      name:
        type: string
  ErrorField:
    type: object
    properties:
      field:
        type: string
      description:
        type: string
  Error:
    type: object
    properties:
      status:
        type: integer
        format: int32
      code:
        type: string
      message:
        type: string
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
x-tagGroups:
- name: Introduction
  tags:
  - intro
- name: API
  tags:
  - Profile
  - Sessions
  - Users
  - organization
  - OrganizationMembers
  - OrganizationInvitations
  - OrganizationConfirmations
  - Subscriptions
  - Coupons
  - Credentials
  - Secrets
  - activity
  - Apps
  - Services
  - Deployments
  - Archives
  - RegionalDeployments
  - Instances
  - Domains
  - PersistentVolumes
  - Snapshots
  - Compose
  - Repositories
  - Logs
  - Metrics
  - Catalog
  - CatalogRegions
  - CatalogInstances
  - Usages
  - Summary
  - DockerHelper
