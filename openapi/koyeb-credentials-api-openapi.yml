openapi: 3.2.0
info:
  title: Koyeb Rest Credentials API
  description: 'The Koyeb API allows you to interact with the Koyeb platform in a simple, programmatic way using conventional HTTP requests.

    '
  version: 1.0.0
servers:
- url: https://app.koyeb.com
security:
- Bearer: []
tags:
- name: Credentials
paths:
  /v1/credentials:
    get:
      summary: List credentials
      operationId: ListCredentials
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCredentialsReply'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithFields'
        '401':
          description: Returned when the token is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Returned when the user does not have permission to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Returned when the resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Returned in case of server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      parameters:
      - name: type
        description: (Optional) A filter for type
        in: query
        required: false
        schema:
          type: string
          enum:
          - INVALID
          - USER
          - ORGANIZATION
          default: INVALID
      - name: name
        description: (Optional) A filter for name
        in: query
        required: false
        schema:
          type: string
      - name: organization_id
        description: (Optional) Filter for an organization
        in: query
        required: false
        schema:
          type: string
      - name: user_id
        description: (Optional) Filter for an user
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: (Optional) The number of items to return
        in: query
        required: false
        schema:
          type: string
      - name: offset
        description: (Optional) The offset in the list of item to return
        in: query
        required: false
        schema:
          type: string
      tags:
      - Credentials
    post:
      summary: Create credential
      operationId: CreateCredential
      responses:
