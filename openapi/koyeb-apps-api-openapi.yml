      properties:
        id:
          type: string
        name:
          type: string
        organization_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        succeeded_at:
          type: string
          format: date-time
        paused_at:
          type: string
          format: date-time
        resumed_at:
          type: string
          format: date-time
        terminated_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/App.Status'
        messages:
          type: array
          items:
            type: string
        version:
          type: string
          format: uint64
        domains:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        life_cycle:
          $ref: '#/components/schemas/AppLifeCycle'
    Domain.Status:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - ERROR
      - DELETING
      - DELETED
      default: PENDING
    UpdateApp:
      type: object
      properties:
        name:
          type: string
        life_cycle:
          $ref: '#/components/schemas/AppLifeCycle'
    PauseAppReply:
      type: object
    ErrorWithFields:
      type: object
      properties:
        status:
          type: integer
          format: int32
        code:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ErrorField'
    ListAppsReply:
      type: object
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/AppListItem'
        limit:
          type: integer
          format: int64
          title: The limit in the request
        offset:
          type: integer
          format: int64
          title: The offset in the request
        count:
          type: integer
          format: int64
          title: The total number of items
        has_next:
          type: boolean
          title: If there is more items after in the collection
    ListAppEventsReply:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AppEvent'
          title: The collection of events
        limit:
