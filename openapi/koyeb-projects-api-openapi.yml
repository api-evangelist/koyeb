        format: int32
      code:
        type: string
      message:
        type: string
      fields:
        type: array
        items:
          $ref: '#/definitions/ErrorField'
  google.protobuf.Any:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  GetProjectReply:
    type: object
    properties:
      project:
        $ref: '#/definitions/Project'
  ErrorField:
    type: object
    properties:
