  DeleteProjectReply:
    type: object
  google.rpc.Status:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/google.protobuf.Any'
  ListProjectsReply:
    type: object
    properties:
      projects:
        type: array
        items:
          $ref: '#/definitions/Project'
      limit:
