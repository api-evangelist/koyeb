openapi: 3.2.0
info:
  title: Koyeb Rest Projects API
  description: 'The Koyeb API allows you to interact with the Koyeb platform in a simple, programmatic way using conventional HTTP requests.

    '
  version: 1.0.0
servers:
- url: https://app.koyeb.com
security:
- Bearer: []
tags:
- name: Projects
paths:
  /v1/projects:
