  paid_channels: E-mail support and chat from the Pro tier; 24x7x365 premium support at Enterprise.
corporate_events:
  - date: '2026-02-20'
    event: >-
      Koyeb entered into a definitive agreement with Mistral AI (announced on the changelog 2026-02-20 and
      in the blog post "Koyeb is joining Mistral AI to Build The Future of AI Infrastructure", 2026-02-17).
      A banner announcing it is rendered on every docs page as of this pass. Recorded because an acquisition
      is a material lifecycle signal for anyone integrating against this API, not as a prediction about what
      happens to the platform.
    sources:
