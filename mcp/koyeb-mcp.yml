  package: https://www.npmjs.com/package/@koyeb/mcp-server
  auth: api-key
  verified: searched
deployment_note: >-
  Koyeb ships NO hosted/remote MCP endpoint. There is nothing an MCP client can POST to: the server is a
  Node stdio process a human installs and runs on a machine before any agent can see it. mcp.koyeb.com does
  not resolve, /.well-known/oauth-protected-resource 404s on every Koyeb host, and neither the docs page
  nor the announcement blog post names a URL. An agent cannot reach Koyeb over MCP without local setup.
server:
  name: koyebApi
  transport: stdio
  package: '@koyeb/mcp-server'
  version: 1.0.9
  version_published: '2026-03-19'
  bin: koyeb-mcp
  repository: https://github.com/koyeb/mcp-server-koyeb
  license: MIT
  runtime: node >=20
  registry_listing: smithery (smithery.yaml present in the repo)
  built_on: '@koyeb/api-client-js ^1.1.6 + @modelcontextprotocol/sdk ^1.27.1'
authentication:
  env_var: KOYEB_TOKEN
  token_creation_url: https://app.koyeb.com/user/settings/api
  scheme: >-
    The token is forwarded to the Koyeb REST API as "Authorization: Bearer <token>". Same credential as the
    REST API and the CLI (which reads KOYEB_API_TOKEN) — note the MCP server uses KOYEB_TOKEN, the CLI uses
    KOYEB_API_TOKEN, and the docs publish both spellings.
  oauth: false
  scopes: >-
    None. The token is organization-wide and unscoped, so an agent running this server holds full read AND
    write authority over every app, service and secret in the organization.
client_configuration:
  file: .cursor/mcp.json or claude_desktop_config.json
