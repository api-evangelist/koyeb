mcp_only:
- tool: exec
  reason: Backed by the WebSocket stream wss://app.koyeb.com/v1/streams/instances/exec, not a request/response REST
    operation. The spec declares GET /v1/streams/instances/exec (ExecCommand) but it is a protocol upgrade, so it
    cannot be called as a normal operation.
- tool: list-one-click-apps
  reason: Fetches https://koyeb.com/api/one-click-apps.json, a website JSON endpoint that is not part of https://api.prod.koyeb.com/public.swagger.json
    at all.
