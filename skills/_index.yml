    - {path: _shared/references/koyeb-cli.md, covers: 'CLI v5.9.1 targeting, sandbox-vs-deploy guidance, list/get/describe/create/update/delete pattern'}
    - {path: _shared/references/koyeb-output.md, covers: 'prefer --output json for automation'}
    - {path: _shared/references/koyeb-regions-instance-types.md, covers: 'region and instance-type catalogue'}
    - {path: '<skill>/references/koyeb-<skill>-flags.md', covers: 'per-command flags, regenerated from `koyeb --help`'}
