grounding:
  drives: Koyeb CLI (koyeb) + the Sandbox SDKs (@koyeb/sandbox-sdk, koyeb-sdk)
  not_grounded_in_openapi: >-
    Koyeb's skills instruct an agent to shell out to the CLI, not to call the REST API directly, so their
    steps reference CLI commands rather than operationIds. The CLI is a thin client over the same published
    contract (--url defaults to https://app.koyeb.com), and cli/koyeb-cli.yml maps the command surface;
    mcp/koyeb-tool-crosswalk.yml maps the MCP tools to operationIds.
  auth: KOYEB_API_TOKEN (or `koyeb login`); the sandbox SDK skills read KOYEB_API_TOKEN too
