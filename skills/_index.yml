observations:
  - >-
    Koyeb's skills target CLI v5.9.1 while the current release is v5.10.2 (2026-05-12), and the plugin
    manifest is at 0.0.2 — an early-stage but genuinely shipped surface.
  - >-
    The published skill set covers secrets, volumes, domains, databases and archives, all of which the MCP
    server still lists under "Planned features". For an agent, Koyeb's skills are the more capable path
    today; the MCP server reaches 13 of 177 operations.
  - >-
    DEFECT worth reporting upstream: plugins/koyeb/skills/sandboxes-cli/SKILL.md indents its `metadata:`
    block with TAB characters, so its YAML frontmatter fails to parse in a strict YAML loader
    ("found character '\t' that cannot start any token"). The other fifteen use spaces. Saved verbatim here
    rather than corrected, because the artifact records what the provider ships.
