shared_references:
  note: >-
    Each skill directory in the upstream repo carries the same five shared reference files plus a
    per-skill flag reference generated from live `koyeb --help`. They were not duplicated sixteen times
    here; the two that carry the operating contract are summarised in cli/koyeb-cli.yml.
  files:
