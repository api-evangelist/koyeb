recommendations_for_provider:
  - >-
    Serve /.well-known/security.txt (RFC 9116) on www.koyeb.com. Koyeb runs a Vanta Trust Center at
    trust.koyeb.com but publishes no machine-readable security contact, so an automated reporter has
    nowhere to look.
  - >-
    Serve /.well-known/api-catalog (RFC 9727) on www.koyeb.com pointing at
    https://api.prod.koyeb.com/public.swagger.json. The Swagger document is already public and already
    named by the docs page; nothing advertises it at a discoverable path.
  - >-
    Stop the app.koyeb.com SPA from answering 200 for unknown paths. A catch-all 200 makes every automated
    discovery probe unreliable against the API host and is indistinguishable from a served document.
